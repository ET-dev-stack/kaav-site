<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAAV</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="home">
  <nav>
    <a href="index.html" class="active">KAAV</a>
    <a href="about.html">About</a>
    <a href="privacy.html">Privacy</a>
  </nav>
  <main class="centered">
    <img src="logo-bw.svg" alt="KAAV" class="logo-mark">
    <p class="lead">Brands, Physical products, Software and Interactive experiences</p>

    <h2>Some of the hardware KAAV has co-developed</h2>
    <div class="logo-row" id="logo-row"></div>

    <h2>Software</h2>
    <p class="aside-note">Coming soon.</p>

    <p class="contact"><a href="mailto:hello@kaav.eu">hello@kaav.eu</a></p>
  </main>
  <footer>&copy; <span id="y"></span> KAAV</footer>
  <script src="brands.js"></script>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear();

    const row = document.getElementById('logo-row');

    function renderItem(b) {
      const el = document.createElement(b.url ? 'a' : 'span');
      if (b.url) {
        el.href = b.url;
        el.target = '_blank';
        el.rel = 'noopener';
      }
      el.innerHTML = b.logo
        ? `<img src="${b.logo}" alt="${b.name}">`
        : `<span class="brand-fallback">${b.name}</span>`;
      return el;
    }

    (window.BRANDS || []).forEach(b => row.appendChild(renderItem(b)));
  </script>
</body>
